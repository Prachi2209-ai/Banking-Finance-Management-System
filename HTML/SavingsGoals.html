<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Savings Goals - FinEdge</title>

    <link rel="stylesheet" href="../CSS/savings.css">
    <link rel="stylesheet" href="../CSS/navigation.css">
</head>

<body>

    <div class="main-container">

        <div id="sidebar-container"></div>

        <!-- ================= RIGHT MAIN CONTENT ================= -->

        <div class="content-area">


            <!-- Top Search Bar -->

            <div class="top-bar">

                <input
                    type="text"
                    placeholder="Search..."
                    class="search-bar"
                >

            </div>


            <!-- Header Section -->

            <div class="header-section">

                <div>

                    <h2>
                        Savings Goals
                    </h2>

                    <p>
                        Save for what matters most
                    </p>

                </div>


                <button class="add-btn">
                    + Add Goal
                </button>

            </div>


            <!-- ================= GOALS GRID ================= -->

            <div class="goals-grid">


                <!-- Goal 1: New Laptop -->

                <div class="card goal-card">

                    <div class="goal-icon">
                        💻
                    </div>


                    <div class="goal-details">

                        <div class="goal-header">

                            <h4>
                                New Laptop
                            </h4>

                            <span class="goal-target">
                                ₹60,000
                            </span>

                        </div>


                        <div class="progress-row">

                            <div class="progress-bg">

                                <div class="progress-fill bar-1">
                                </div>

                            </div>

                            <span class="percent-text">
                                67%
                            </span>

                        </div>


                        <div class="goal-footer">

                            <p class="saved-amount">
                                ₹40,000 saved
                            </p>

                            <p class="target-date">
                                Target: Dec 2026
                            </p>

                        </div>

                    </div>

                </div>


                <!-- Goal 2: Europe Trip -->

                <div class="card goal-card">

                    <div class="goal-icon">
                        ✈️
                    </div>


                    <div class="goal-details">

                        <div class="goal-header">

                            <h4>
                                Europe Trip
                            </h4>

                            <span class="goal-target">
                                ₹1,50,000
                            </span>

                        </div>


                        <div class="progress-row">

                            <div class="progress-bg">

                                <div class="progress-fill bar-2">
                                </div>

                            </div>

                            <span class="percent-text">
                                33%
                            </span>

                        </div>


                        <div class="goal-footer">

                            <p class="saved-amount">
                                ₹50,000 saved
                            </p>

                            <p class="target-date">
                                Target: Dec 2026
                            </p>

                        </div>

                    </div>

                </div>


            </div>

        </div>

    </div>
<script src="../JAVASCRIPT/savings.js"></script>
<script src="../JAVASCRIPT/common.js"></script>
</body>

</html>
