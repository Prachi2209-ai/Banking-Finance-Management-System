<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FinEdge - Transactions</title>
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="stylesheet" href="../CSS/Transactions.css">
  <link rel="stylesheet" href="../CSS/navigation.css?v=2">
</head>
<body>

  <div id="sidebar-container"></div>

  <!-- MAIN WRAPPER -->
  <div class="main-wrapper">
    <!-- TOP HEADER -->
    <header class="top-header">
      <div class="header-search">
        <i data-lucide="search"></i>
        <input type="text" placeholder="Search anything...">
      </div>

      <div class="header-actions">
        <button class="icon-btn" aria-label="Notifications">
          <i data-lucide="bell"></i>
        </button>
        <div class="account-identity" aria-label="Signed-in user">
          <div class="account-avatar" aria-hidden="true">U</div>
          <div class="account-identity-details">
            <span class="account-identity-name">User Name</span>
            <span class="account-identity-role">Account Holder</span>
          </div>
        </div>
      </div>
    </header>

    <!-- MAIN CONTENT AREA -->
    <main class="main-content">
      <div class="page-header">
        <h1 class="page-title">Transactions</h1>
        <p class="page-subtitle">View and manage your transaction history</p>
      </div>

      <!-- FILTER BAR -->
      <div class="filter-bar">
        <div class="search-input-wrapper">
          <i data-lucide="search"></i>
          <input type="search" id="transactionSearch" placeholder="Search transactions..."
            aria-label="Search transactions">
        </div>

        <div class="filter-controls">
          <select class="custom-select" id="typeFilter" aria-label="Filter by transaction type">
            <option value="all">All Types</option>
            <option value="Income">Income</option>
            <option value="Shopping">Shopping</option>
            <option value="Food">Food</option>
            <option value="Bills">Bills</option>
            <option value="Transfer">Transfer</option>
          </select>

          <select class="custom-select" id="dateFilter" aria-label="Filter by date">
            <option value="3">Last 3 Months</option>
            <option value="thisMonth">This Month</option>
            <option value="6">Last 6 Months</option>
            <option value="12">Last 1 Year</option>
            <option value="all">All Time</option>
          </select>

          <button class="btn-export" type="button" id="exportBtn">
            <i data-lucide="download"></i>
            Export
          </button>
        </div>
      </div>

      <p id="transactionMessage" class="transaction-message" role="status" aria-live="polite"></p>

      <!-- TRANSACTIONS TABLE CARD -->
      <div class="card-box">
        <table class="data-table">
          <thead>
            <tr>
              <th>Date</th>
              <th>Description</th>
              <th>Category</th>
              <th class="text-right">Amount</th>
              <th class="text-center">Status</th>
            </tr>
          </thead>
          <tbody id="transactionTableBody"></tbody>
        </table>
      </div>
    </main>
  </div>

  <script>
    lucide.createIcons();
  </script>
  <script src="../JAVASCRIPT/userData.js"></script>
  <script src="../JAVASCRIPT/Transactions.js"></script>
  <script src="../JAVASCRIPT/common.js"></script>
</body>
</html>
