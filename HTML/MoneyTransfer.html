<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FinEdge - Money Transfer</title>
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="stylesheet" href="../CSS/MoneyTransfer.css">
  <link rel="stylesheet" href="../CSS/navigation.css?v=2">
</head>
<body>

  <div id="sidebar-container"></div>

  <!-- MAIN WRAPPER -->
  <div class="main-wrapper">
    <!-- TOP HEADER -->
    <header class="top-header">
      <div class="header-search">
        <i data-lucide="search"></i>
        <input type="text" placeholder="Search anything...">
      </div>

      <div class="header-actions">
        <button class="icon-btn" aria-label="Notifications">
          <i data-lucide="bell"></i>
        </button>
        <div class="account-identity" aria-label="Signed-in user">
          <div class="account-avatar" aria-hidden="true">U</div>
          <div class="account-identity-details">
            <span class="account-identity-name">User Name</span>
            <span class="account-identity-role">Account Holder</span>
          </div>
        </div>
      </div>
    </header>

    <!-- MAIN CONTENT AREA -->
    <main class="main-content">
      <div class="page-header">
        <h1 class="page-title">Money Transfer</h1>
        <p class="page-subtitle">Record and track transfers from your saved accounts</p>
      </div>

      <p id="transferStorageMessage" class="transfer-storage-message" role="alert" hidden></p>

      <div class="form-card">
        <form id="transferForm">
          <div class="form-group">
            <label class="form-label" for="accountSelect">Select Account</label>
            <select class="form-control" id="accountSelect" required>
            </select>
            <p id="balanceDisplay" class="balance-display" aria-live="polite"></p>
          </div>

          <div class="form-group">
            <label class="form-label" for="recipient">Recipient UPI ID / Account Number</label>
            <input type="text" class="form-control" id="recipient" maxlength="254"
              placeholder="e.g. user@upi or 1234567890" required>
          </div>

          <div class="form-group">
            <label class="form-label" for="amount">Amount (₹)</label>
            <input type="number" class="form-control" id="amount" min="0.01" step="0.01"
              placeholder="Enter amount" required>
          </div>

          <div class="form-group">
            <label class="form-label" for="note">Note / Remark (Optional)</label>
            <input type="text" class="form-control" id="note" maxlength="120"
              placeholder="What is this for?">
          </div>

          <button type="submit" class="btn-submit" id="transferButton">Transfer Now</button>
          <p id="message" class="transfer-message" role="status" aria-live="polite"></p>
        </form>
      </div>

      <div class="form-card recent-transfers-card">
        <h2>Recent Transfers</h2>
        <div id="transactionList" class="transfer-list" aria-live="polite">
          <p class="no-transfers">No transfers yet.</p>
        </div>
      </div>
    </main>
  </div>

  <script>
    lucide.createIcons();
  </script>
    <script src="../JAVASCRIPT/userData.js"></script>
    <script src="../JAVASCRIPT/MoneyTransfer.js"></script>
  <script src="../JAVASCRIPT/common.js"></script>
</body>
</html>
