<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FinEdge - Money Transfer</title>
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="stylesheet" href="../CSS/MoneyTransfer.css">
</head>
<body>

  <!-- SIDEBAR -->
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-icon">
        <i data-lucide="help-circle"></i>
      </div>
      <span class="brand-text">FinEdge</span>
    </div>

    <nav class="nav-menu">
      <a href="dashboard.html" class="nav-item">
        <span>Dashboard</span>
      </a>

      <div class="nav-section-title">BANKING SERVICES</div>

      <a href="./AccountsCards.html" class="nav-item">
        <span>Accounts & Cards</span>
      </a>
      <a href="./MoneyTransfer.html" class="nav-item active">
        <span>Money Transfer</span>
      </a>
      <a href="./Transactions.html" class="nav-item">
        <span>Transactions</span>
      </a>

      <div class="nav-section-title">PERSONAL FINANCE</div>

      <a href="./BudgetExpenses.html" class="nav-item">
        <span>Budget & Expenses</span>
      </a>
      <a href="./SavingsGoals.html" class="nav-item">
        <span>Savings Goals</span>
      </a>
      <a href="./BillsPayments.html" class="nav-item">
        <span>Bills & Payments</span>
      </a>

      <div class="nav-section-title">PROFILE & SETTINGS</div>

      <a href="profile.html" class="nav-item">
        <span>Profile</span>
      </a>
      <a href="settings.html" class="nav-item">
        <span>Settings</span>
      </a>
    </nav>

    <div class="sidebar-footer">
      <a href="login.html" class="nav-item logout-link">
        <span>Logout</span>
      </a>
    </div>
  </aside>

  <!-- MAIN WRAPPER -->
  <div class="main-wrapper">
    <!-- TOP HEADER -->
    <header class="top-header">
      <div class="header-search">
        <i data-lucide="search"></i>
        <input type="text" placeholder="Search anything...">
      </div>

      <div class="header-actions">
        <button class="icon-btn" aria-label="Notifications">
          <i data-lucide="bell"></i>
        </button>
        <div class="user-profile">
          <div class="user-details">
            <span class="user-name">User Name</span>
            <span class="user-role">Student</span>
          </div>
          <i data-lucide="chevron-down" class="chevron-icon"></i>
        </div>
      </div>
    </header>

    <!-- MAIN CONTENT AREA -->
    <main class="main-content">
      <div class="page-header">
        <h1 class="page-title">Money Transfer</h1>
        <p class="page-subtitle">Send money instantly to anyone, anywhere</p>
      </div>

      <div class="form-card">
        <form>
          <div class="form-group">
            <label class="form-label">Select Account</label>
            <select class="form-control">
              <option>Savings Account (•••• 1234) - ₹85,240.00</option>
              <option>Current Account (•••• 5678) - ₹39,260.00</option>
            </select>
          </div>

          <div class="form-group">
            <label class="form-label">Recipient UPI ID / Account Number</label>
            <input type="text" class="form-control" placeholder="e.g. user@upi or 1234567890">
          </div>

          <div class="form-group">
            <label class="form-label">Amount (₹)</label>
            <input type="number" class="form-control" placeholder="Enter amount">
          </div>

          <div class="form-group">
            <label class="form-label">Note / Remark (Optional)</label>
            <input type="text" class="form-control" placeholder="What is this for?">
          </div>

          <button type="submit" class="btn-submit">Transfer Now</button>
        </form>
      </div>
    </main>
  </div>

  <script>
    lucide.createIcons();
  </script>
</body>
</html>
